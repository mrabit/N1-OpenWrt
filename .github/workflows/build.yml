name: Build ImmortalWrt-25.12 firmware

# Unified N1 + x86/64 build. A matrix `build` job compiles each profile in
# parallel (they share ~95% of the steps); a single `release` job then collects
# every profile's image and publishes ONE combined release (assets in one place).
# N1 images are additionally pushed to the fixed `OpenWrt` tag that
# luci-app-amlogic (晶晨宝盒) OTA reads — x86 images never land there.

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      profile:
        description: 'Profile(s) to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - N1
          - x86
          - armvirt
  schedule:
    - cron: "27 18 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  TZ: Asia/Shanghai

jobs:
  # `matrix` context is NOT available in a job-level `if` (only github/needs/
  # vars/inputs are), so filtering the matrix there causes a startup_failure.
  # Instead, build the matrix dynamically here from the `profile` input and let
  # `build` consume it via fromJSON — a single-profile run yields a 1-entry matrix.
  setup:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      build_stamp: ${{ steps.stamp.outputs.build_stamp }}
    steps:
      - name: Mint one global build stamp
        id: stamp
        # setup runs exactly once, before the parallel build legs and the release
        # job — the single point where all artifacts can agree on ONE timestamp.
        # Format 2026.08.23_143005 (dotted date + HHMMSS, no colon: git tags and
        # filenames reject ':'). TZ from workflow env (Asia/Shanghai). Every build
        # leg bakes this exact value into its image name; the release job reads it
        # back OUT of the filename (images stay the single source of truth), so the
        # tag firmware_<date>_<time> always matches the images to the second.
        run: |
          echo "build_stamp=$(TZ="$TZ" date '+%Y.%m.%d_%H%M%S')" >> "$GITHUB_OUTPUT"
      - name: Compute build matrix
        id: set
        env:
          PROFILE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.profile || 'all' }}
        run: |
          set -euo pipefail
          n1='{"profile":"N1","target_dir":"armsr/armv8","config":"armsr/armv8/N1/.config","diy":"armsr/armv8/N1/diy.sh","cache":"n1"}'
          x86='{"profile":"x86","target_dir":"x86/64","config":"x86/64/.config","diy":"common/diy.sh","cache":"x86"}'
          armvirt='{"profile":"armvirt","target_dir":"armsr/armv8","config":"armsr/armv8/armvirt/.config","diy":"common/diy.sh","cache":"armvirt"}'
          case "$PROFILE" in
            N1)      include="[$n1]" ;;
            x86)     include="[$x86]" ;;
            armvirt) include="[$armvirt]" ;;
            *)       include="[$n1,$x86,$armvirt]" ;;
          esac
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1

    - name: Free up disk space
      uses: jlumbroso/free-disk-space@v1.3.1
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Initialize environment
      timeout-minutes: 45
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -euxo pipefail
        sudo -E apt-get update
        sudo -E "$GITHUB_WORKSPACE/bin/build-deps.sh"
        sudo -E apt-get autoremove --purge -y
        sudo -E apt-get clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH --single-branch --depth=1 openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
        echo "FILE_DATE=$(date +"%Y%m%d")" >> $GITHUB_ENV
    - name: Update & Install feeds
      run: |
        set -euo pipefail
        chmod +x ${{ matrix.diy }} common/diy.sh
        cd openwrt
        update_feeds() {
          for attempt in 1 2 3; do
            ./scripts/feeds update -a && return 0
            echo "Feed update failed (attempt $attempt/3), retrying..." >&2
            sleep $((attempt * 5))
          done
          echo "Feed update failed after 3 attempts." >&2
          return 1
        }
        update_feeds
        COMMON_DIR="$GITHUB_WORKSPACE/common" $GITHUB_WORKSPACE/${{ matrix.diy }}
        update_feeds
        ./scripts/feeds install -a

    - name: Load custom config
      run: |
        rm -rf openwrt/files openwrt/.config
        # Shared overlay, then per-profile overlay (armsr/armv8/N1/files layers on
        # top of common/files — e.g. N1-only /etc/config/wireless), then profile
        # config + shared service stack. Mirrors bin/build-*.sh's PROFILE_DIR/files.
        cp -r common/files openwrt/files
        profile_files="$(dirname "${{ matrix.config }}")/files"
        [ -d "$profile_files" ] && cp -rf "$profile_files/." openwrt/files/
        cp ${{ matrix.config }} openwrt/.config
        cat common/config.services >> openwrt/.config
        # Enable ccache. CONFIG_DEVEL=y is the REQUIRED master toggle: in
        # config/Config-devel.in both CCACHE ("Use ccache" if DEVEL) and its
        # CCACHE_DIR ("if CCACHE") are prompt-gated behind DEVEL, so without it
        # `make defconfig` silently strips CONFIG_CCACHE=y — gcc is never wrapped
        # as `ccache gcc`, nothing is ever cached, and every run cold-compiled
        # ~92 min. (The prior "path does not exist" post-step warning was the same
        # bug: ccache off → .ccache never created.) CONFIG_CCACHE_DIR pins the dir
        # to the exact absolute path actions/cache saves; the default './.ccache'
        # already resolves there, but pinning it is immune to any cwd change.
        {
          echo "CONFIG_DEVEL=y"
          echo "CONFIG_CCACHE=y"
          echo 'CONFIG_CCACHE_DIR="/workdir/openwrt/.ccache"'
          # Bake the build date into VERSION_CODE (%C) so LuCI Status → Overview
          # "固件版本" shows it: DISTRIB_DESCRIPTION / OPENWRT_RELEASE = "%D %V %C"
          # → "ImmortalWrt 25.12-SNAPSHOT 2026.08.23 14:30:05". Only %C (defaults to
          # git REVISION otherwise); VERSION_NUMBER untouched, so OP_VERSION / image
          # names are unaffected. TZ=Asia/Shanghai from job env (matches FILE_DATE).
          # The space is fine — %C keeps spaces for display; VERSION_CODE isn't in
          # our image names (only the %c filename variant would transform spaces).
          # CONFIG_VERSIONOPT=y is the master toggle — without it defconfig strips
          # the VERSION_* symbols (verified vs ImmortalWrt's official buildinfo).
          echo "CONFIG_VERSIONOPT=y"
          echo "CONFIG_VERSION_CODE=\"$(date '+%Y.%m.%d %H:%M:%S')\""
        } >> openwrt/.config

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: /workdir/openwrt/.ccache
        key: ccache-${{ matrix.cache }}-${{ env.REPO_BRANCH }}-${{ env.FILE_DATE }}
        restore-keys: |
          ccache-${{ matrix.cache }}-${{ env.REPO_BRANCH }}-

    - name: Cache downloads
      # Shared across ALL profiles (no matrix.cache in the key): N1/x86/armvirt
      # download near-identical source tarballs (same common/config.services), so
      # 3 separate dl caches wasted ~2/3 of the 10 GB repo budget. This is a budget
      # optimization, NOT the ccache fix — ccache was empty because of the path bug
      # (see CONFIG_CCACHE_DIR), not eviction. But once ccache actually saves
      # (~2.5G x 3 profiles), the freed dl budget is what keeps all three under the
      # 10 GB ceiling instead of evicting each other. Parallel matrix legs restore
      # fine; only the first save with this key wins (others get a harmless
      # "Cache already exists"), converging over runs.
      uses: actions/cache@v4
      with:
        path: /workdir/openwrt/dl
        key: dl-${{ env.REPO_BRANCH }}-${{ env.FILE_DATE }}
        restore-keys: |
          dl-${{ env.REPO_BRANCH }}-

    - name: SSH connect to Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: github.event.inputs.ssh == 'true'

    - name: Download package
      working-directory: ./openwrt
      run: |
        make defconfig
        make download -j$(( $(nproc) * 2 ))
        find dl -size -1k -exec rm -f {} \;

    - name: Compile firmware
      env:
        # 2G thrashes within a single full build (toolchain+kernel+all pkgs
        # generate > 2G of objects), so early objects get evicted before a later
        # unit reuses them. Now that ccache actually persists (see CONFIG_CCACHE_DIR
        # above — before that fix nothing was ever saved, so maxsize was moot),
        # 2.5G lets a full build's objects survive both within and across runs.
        CCACHE_MAXSIZE: 2.5G
      run: |
        chmod -R 755 openwrt
        cd openwrt
        # Ensure the pinned ccache dir exists before compile so actions/cache finds
        # a populated path in its post-step (empty/missing = silent "no cache saved").
        mkdir -p /workdir/openwrt/.ccache
        echo -e "$(nproc) thread compile"
        make -j$(( $(nproc) + 1 )) || make -j1 V=s
    - name: Package N1 firmware
      if: matrix.profile == 'N1'
      # Was the ophub/amlogic-s9xxx-openwrt@main Action, but that's a black box:
      # it re-clones ophub internally and runs remake, so it never sees our
      # openwrt-install-amlogic patch (the one that stops ophub's emmc installer
      # deleting AdGuardHome — see CLAUDE.md "AGH-on-emmc"). Call bin/package.sh
      # instead — the same script local builds use — so CI and local package
      # identically and the patch actually applies. It clones ophub@main to
      # $BUILD_ROOT/ophub, patches remake + openwrt-install-amlogic, runs remake,
      # and drops the renamed *.img.gz into dist/ (Collect firmware picks it up).
      env:
        OUTDIR: ${{ github.workspace }}          # holds openwrt/bin/targets/...
        BUILD_ROOT: /workdir                       # native ext4, same vol as build
        ALL_PROXY: ''                              # CI has direct internet, no socks
        BUILD_STAMP: ${{ needs.setup.outputs.build_stamp }}  # shared with x86/armvirt
      run: bin/package.sh

    - name: Collect firmware
      run: |
        set -euo pipefail
        out="out/${{ matrix.profile }}"
        mkdir -p "$out"
        # Unified naming shared by both profiles (<date>_<time> = 2026.08.23_143005):
        #   N1:  immortalwrt_<op>_s905d_k<kernel>_<date>_<time>.img.gz
        #   x86: immortalwrt_<op>_x86_64_k<kernel>_<date>_<time>.img.gz
        # N1 keeps the `s905d_k6.12.NN` segment so luci-app-amlogic OTA
        # (regex .*_s905d_.*k6.12.[0-9]+.*.img.gz) still matches it.
        # op version is read from the built tree's include/version.mk
        # (VERSION_NUMBER, e.g. 25.12-SNAPSHOT), with -SNAPSHOT stripped -> 25.12.
        # Once upstream tags a real patch level on this line (25.12.1), that flows
        # through automatically. Falls back to REPO_BRANCH (openwrt-25.12 -> 25.12)
        # if the tree/line can't be read.
        OP_VERSION="$(sed -n 's/^VERSION_NUMBER:=$(if.*,\(.*\))$/\1/p' \
          openwrt/include/version.mk 2>/dev/null | head -1)"
        OP_VERSION="${OP_VERSION%-SNAPSHOT}"
        [ -n "$OP_VERSION" ] || OP_VERSION="${REPO_BRANCH#openwrt-}"
        # One global stamp from setup (2026.08.23_143005) — all 3 profiles share it,
        # so the images (and the release tag derived from them) agree to the second.
        imgstamp="${{ needs.setup.outputs.build_stamp }}"
        case "${{ matrix.profile }}" in
        N1)
          # bin/package.sh already did the full N1 finish: parsed s905d_k<kernel>,
          # applied BUILD_STAMP (the shared setup stamp, passed in above), renamed to
          # the unified scheme, and recompressed with `gzip -n` (resets the stale
          # FNAME header) into the repo's dist/. So there's nothing to rename or
          # recompress here — just move the finished image into out/. OP_VERSION and
          # imgstamp are already baked into the dist/ filename by package.sh, so this
          # branch doesn't use them (the x86/armvirt branch still does).
          # 2>/dev/null || true so a no-match ls (exit 2) doesn't trip set -e
          # before the friendly check below (mirrors the x86/armvirt branch).
          src="$(ls dist/immortalwrt_*_s905d_*.img.gz 2>/dev/null | head -1)" || true
          if [ -z "${src:-}" ]; then
            echo "ERROR: bin/package.sh produced no s905d image in dist/; contents:" >&2
            ls -la dist/ >&2 || true
            exit 1
          fi
          cp -v "$src" "$out/"
          ;;
        x86|armvirt)
          # x86 and armvirt both emit a bootable EFI combined image directly (x86/64
          # target for x86, armsr/armv8 for the ARM64 VM). Publish only the squashfs
          # combined-efi (sysupgrade-friendly, read-only root + overlay). The board
          # segment is the arch (x86_64 / armv8), not the profile name.
          if [ "${{ matrix.profile }}" = "x86" ]; then
            outdir="openwrt/bin/targets/x86/64";      board="x86_64"
          else
            outdir="openwrt/bin/targets/armsr/armv8"; board="armv8"
          fi
          src="$(ls "$outdir"/*squashfs-combined-efi.img.gz 2>/dev/null | head -1)" || true
          if [ -z "${src:-}" ]; then
            echo "No squashfs-combined-efi image found in $outdir; contents:" >&2
            ls -la "$outdir" >&2
            exit 1
          fi
          kver="$(grep -E '^kernel ' "$outdir"/*.manifest 2>/dev/null \
            | awk '{print $3}' | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)"
          if [ -z "$kver" ]; then
            echo "ERROR: could not parse kernel from $outdir/*.manifest — the" >&2
            echo "       naming scheme requires it. Manifest kernel line:" >&2
            grep -E '^kernel ' "$outdir"/*.manifest >&2 || echo "  (no ^kernel line)" >&2
            exit 1
          fi
          cp -v "$src" "$out/immortalwrt_${OP_VERSION}_${board}_k${kver}_${imgstamp}.img.gz"
          ;;
        esac

    - name: Upload profile artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ matrix.profile }}
        path: out/${{ matrix.profile }}/*.img.gz
        if-no-files-found: error
        retention-days: 3
  release:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
    - name: Download all firmware artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: firmware-*
        path: dist
        merge-multiple: true

    - name: List collected images
      run: |
        set -euo pipefail
        echo "Collected images:"
        find dist -name '*.img.gz' -printf '  %p (%s bytes)\n'
        # Derive OP_VERSION from an image name (immortalwrt_<op>_<board>_...),
        # 2nd underscore field — the build stage already baked the real version
        # in there, so the notes match the images exactly. Fall back to the
        # branch-derived value if no image is present (shouldn't happen).
        anyimg="$(find dist -name '*.img.gz' | head -1)"
        opver="$(basename "${anyimg:-}" | cut -d_ -f2)"
        [ -n "$opver" ] || opver="${REPO_BRANCH#openwrt-}"
        echo "OP_VERSION=$opver" >> $GITHUB_ENV
        # Build stamp lives in the image name's tail: immortalwrt_<op>_<board>_k<kernel>_<date>_<time>.img.gz
        # e.g. ..._2026.08.23_143005.img.gz. Pull the 2026.08.23_143005 tail (last
        # two _-fields) — the images are the single source of truth, so tag + notes
        # match them to the second. TAG_STAMP is git/asset-safe (no ':'); FILE_DISPLAY
        # is the human form 2026.08.23 14:30:05 for the release notes.
        base="$(basename "${anyimg:-}" .img.gz)"
        imgdate="$(echo "$base" | grep -oE '[0-9]{4}\.[0-9]{2}\.[0-9]{2}_[0-9]{6}' | head -1 || true)"
        [ -n "$imgdate" ] || imgdate="$(TZ=$TZ date '+%Y.%m.%d_%H%M%S')"
        d="${imgdate%_*}"; t="${imgdate#*_}"    # d=2026.08.23  t=143005
        echo "TAG_STAMP=${d//./}_${t}" >> $GITHUB_ENV        # firmware tag: 20260823_143005
        echo "FILE_DISPLAY=${d} ${t:0:2}:${t:2:2}:${t:4:2}" >> $GITHUB_ENV  # notes: 2026.08.23 14:30:05
        # Kernel numbers live in the image name's _k<kernel>_ segment. N1 and x86
        # use different kernels (flippy vs ImmortalWrt), so pull each separately;
        # empty if that profile wasn't built this run.
        n1img="$(find dist -name '*_s905d_*.img.gz' | head -1)"
        x86img="$(find dist -name '*_x86_64_*.img.gz' | head -1)"
        avimg="$(find dist -name '*_armv8_*.img.gz' | head -1)"
        n1k="$(basename "${n1img:-}" | grep -oP '_k\K[0-9.]+' || true)"
        x86k="$(basename "${x86img:-}" | grep -oP '_k\K[0-9.]+' || true)"
        avk="$(basename "${avimg:-}" | grep -oP '_k\K[0-9.]+' || true)"
        echo "N1_KERNEL=$n1k" >> $GITHUB_ENV
        echo "X86_KERNEL=$x86k" >> $GITHUB_ENV
        echo "ARMVIRT_KERNEL=$avk" >> $GITHUB_ENV
        # N1 images (unified name) match the amlogic OTA regex; x86 don't. Split
        # them out by the _s905d_ segment for the fixed OpenWrt (OTA) tag.
        mkdir -p n1-only
        find dist -name '*_s905d_*.img.gz' -exec cp -v {} n1-only/ \; || true

    - name: Reset releases (fresh publish date, drop stale-named assets)
      # softprops updates an existing release via API PATCH: it uploads the new
      # files but never refreshes published_at (GitHub only stamps it on first
      # publish) and never removes assets it didn't upload. So on rolling tags
      # the date freezes at first creation and old-named images pile up. Deleting
      # the release object first (keeping the git tag) makes softprops recreate
      # it below → fresh published_at + a clean asset list.
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        gh release delete "firmware_${TAG_STAMP}" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
        # OpenWrt (N1 OTA) only when we actually have an N1 image to republish;
        # an x86-only run must not wipe the OTA source without replacing it.
        # --cleanup-tag also drops the git tag so softprops recreates it fresh at
        # the current commit (delete the tag first, then re-release).
        if ls n1-only/*.img.gz >/dev/null 2>&1; then
          gh release delete OpenWrt --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
        fi

    - name: Publish combined dated release
      uses: softprops/action-gh-release@v3.0.2
      with:
        tag_name: firmware_${{ env.TAG_STAMP }}
        make_latest: true
        files: dist/*.img.gz
        body: |
          ImmortalWrt ${{ env.OP_VERSION }} · N1 (Amlogic S905D) + x86/64 + ARM64 VM (armvirt) EFI 固件，构建于 ${{ env.FILE_DISPLAY }}。
          * N1: immortalwrt_${{ env.OP_VERSION }}_s905d_k${{ env.N1_KERNEL }}_*.img.gz —— 内核 ${{ env.N1_KERNEL }}（flippy），晶晨宝盒可在线升级
          * x86: immortalwrt_${{ env.OP_VERSION }}_x86_64_k${{ env.X86_KERNEL }}_*.img.gz —— 内核 ${{ env.X86_KERNEL }}（ImmortalWrt），UEFI 引导
          * armvirt: immortalwrt_${{ env.OP_VERSION }}_armv8_k${{ env.ARMVIRT_KERNEL }}_*.img.gz —— 内核 ${{ env.ARMVIRT_KERNEL }}（ImmortalWrt），ARM64 UEFI，适配 UTM/QEMU（Apple Silicon）
          * 基本信息
          IP: 192.168.0.4
          账户: root
          密码: password

    - name: Update N1 OTA release (amlogic 在线升级源)
      # luci-app-amlogic OTA pulls from this fixed tag (see files/etc/config/amlogic).
      # N1 images ONLY — x86 never lands here, so 晶晨宝盒 can't offer the wrong image.
      if: ${{ hashFiles('n1-only/*.img.gz') != '' }}
      uses: softprops/action-gh-release@v3.0.2
      with:
        tag_name: OpenWrt
        make_latest: false
        files: n1-only/*.img.gz
        body: |
          ImmortalWrt ${{ env.OP_VERSION }} · N1 内核 ${{ env.N1_KERNEL }}（flippy）—— 滚动更新的最新 N1 固件（luci-app-amlogic 在线升级源），构建于 ${{ env.FILE_DISPLAY }}。
          历史版本见 firmware_<日期>_<时间> 标签。
          * 基本信息
          IP: 192.168.0.4
          账户: root
          密码: password

