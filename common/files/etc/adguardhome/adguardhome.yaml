# AdGuardHome baked-in config (runbook §6). schema_version must match the built AGH
# (currently 0.107.76 -> schema 34); AGH auto-migrates if it later bumps.
http:
  address: 0.0.0.0:3000
language: zh-cn
dns:
  bind_hosts:
    - 0.0.0.0
  port: 53
  # 路由器场景关闭每客户端限速：默认 20 查询/秒/客户端，浏览器多标签或下游再转发
  # 的设备很容易触顶被丢包，表现为偶发解析失败。0 = 不限速。
  ratelimit: 0
  upstream_dns:
    - 127.0.0.1:15353
  # 上游 chinadns-ng(:15353) 全部失败时才回退到这里，保证 PassWall/chinadns-ng
  # 崩溃时国内域名仍能解析、客户端不至于整网无 DNS。正常解析永远走上游分流，
  # 只有上游超时/不可达才 fallback（此时国外域名可能被污染直连，属故障降级）。
  fallback_dns:
    - 223.5.5.5
    - 119.29.29.29
  bootstrap_dns:
    - 223.5.5.5
    - 119.29.29.29
  # 旁路由禁 IPv6(AAAA) 解析：本机只做 IPv4 旁路代理，放行 AAAA 会让客户端走
  # IPv6 直连绕过 PassWall，且部分 IPv6 路径不通。与真机 0.4 部署一致。
  aaaa_disabled: true
  # DNSSEC 关：上游是 chinadns-ng(:15353) 分流到国内 DNS + 代理，多数国内 DNS 不透传
  # DNSSEC 签名记录，开了验签会失败导致解析不了。旁路由 + 国内分流场景刻意关闭。
  enable_dnssec: false
filters:
  - enabled: true
    url: https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt
    name: AdGuard DNS filter
    id: 1
  - enabled: true
    url: https://adaway.org/hosts.txt
    name: AdAway
    id: 2
  - enabled: true
    url: https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
    name: Steven Black hosts
    id: 4
  - enabled: true
    url: https://anti-ad.net/easylist.txt
    name: anti-ad easylist
    id: 5
  - enabled: true
    url: https://raw.githubusercontent.com/afwfv/DD-AD/refs/heads/release/dns.txt
    name: DD-AD dns
    id: 6
user_rules:
  - '@@||affiliates.*.com^$important'
  # 按需为受信任客户端放行（示例）
  - '@@||*^$client=192.168.1.10'
  - '||istatmenus.app^'
  - '||bjango.com^'
  - '||checkout.paddle.com^'
filtering:
  # 拦截模式=空IP：被拦域名统一返回 0.0.0.0(A)/::（AAAA），直接让连接失败。
  # 与真机 0.4 部署一致（默认 default 会返回规则指定 IP 或 0.0.0.0）。
  blocking_mode: null_ip
  # DNS 重写示例：将内部/自建服务域名指向局域网 IP。
  # 按实际部署替换 domain 与 answer，可增删条目。
  rewrites:
    - domain: service.example.com
      answer: 192.168.1.2
      enabled: true
    - domain: nas.example.com
      answer: 192.168.1.3
      enabled: true
# 查询日志：功能保留(UI 仍能看最近查询)，但不落盘 —— N1 eMMC / x86,armvirt 的
# SSD 上，默认落盘保留 90 天是持续写放大。file_enabled:false 让日志只留在内存，
# 保留窗口收窄到 24h，重启即清。旁路由不需要长期审计 DNS。
querylog:
  enabled: true
  file_enabled: false
  interval: 24h
  size_memory: 1000
# 统计：保留图表功能，周期收窄到 24h(默认 90 天)，减少聚合数据的写盘量。
statistics:
  enabled: true
  interval: 24h
schema_version: 34
